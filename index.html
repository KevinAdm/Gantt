
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gantt Planner</title>
<style>
body{font-family:Arial,sans-serif;margin:20px;background:#f5f7fa}
.container{max-width:1200px;margin:auto}
.card{background:white;padding:20px;border-radius:10px;margin-bottom:20px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
input,button{padding:8px;margin:5px}
button{background:#0078d4;color:white;border:none;border-radius:5px;cursor:pointer}
button:hover{background:#005ea6}
table{width:100%;border-collapse:collapse}
th,td{border:1px solid #ddd;padding:8px;text-align:left}
#gantt{overflow-x:auto}
.gantt-row{display:flex;align-items:center;margin:8px 0}
.task-name{width:180px;font-weight:bold}
.timeline{position:relative;height:30px;flex:1;background:#eee;border-radius:5px}
.bar{position:absolute;height:100%;background:#28a745;border-radius:5px;color:white;font-size:12px;display:flex;align-items:center;justify-content:center}
.check-item{margin:6px 0}
</style>
</head>
<body>
<div class="container">

<div class="card">
<h2>Ingreso de tareas</h2>
<input type="text" id="taskName" placeholder="Tarea">
<input type="date" id="startDate">
<input type="date" id="endDate">
<button onclick="addTask()">Agregar</button>
</div>

<div class="card">
<h2>Lista de tareas</h2>
<table>
<thead>
<tr>
<th>Tarea</th>
<th>Inicio</th>
<th>Fin</th>
</tr>
</thead>
<tbody id="taskTable"></tbody>
</table>
<button onclick="generateViews()">Generar Gantt</button>
</div>

<div class="card">
<h2>Checklist</h2>
<div id="checklist"></div>
</div>

<div class="card">
<h2>Diagrama de Gantt</h2>
<div id="gantt"></div>
</div>

</div>

<script>
const tasks=[];

function addTask(){
 const name=document.getElementById('taskName').value;
 const start=document.getElementById('startDate').value;
 const end=document.getElementById('endDate').value;

 if(!name||!start||!end){
   alert('Complete todos los campos');
   return;
 }

 tasks.push({name,start,end,done:false});
 renderTable();
}

function renderTable(){
 const tbody=document.getElementById('taskTable');
 tbody.innerHTML='';

 tasks.forEach(t=>{
   tbody.innerHTML+=`<tr>
      <td>${t.name}</td>
      <td>${t.start}</td>
      <td>${t.end}</td>
   </tr>`;
 });
}

function generateViews(){
 generateChecklist();
 generateGantt();
}

function generateChecklist(){
 const div=document.getElementById('checklist');
 div.innerHTML='';

 tasks.forEach((t,i)=>{
  div.innerHTML+=`
   <div class='check-item'>
      <input type='checkbox' onchange='tasks[${i}].done=this.checked'>
      ${t.name}
   </div>`;
 });
}

function generateGantt(){
 const gantt=document.getElementById('gantt');
 gantt.innerHTML='';

 if(tasks.length===0) return;

 const minDate=new Date(Math.min(...tasks.map(t=>new Date(t.start))));
 const maxDate=new Date(Math.max(...tasks.map(t=>new Date(t.end))));
 const totalDays=Math.ceil((maxDate-minDate)/(1000*60*60*24))+1;

 tasks.forEach(t=>{
   const start=new Date(t.start);
   const end=new Date(t.end);

   const offset=Math.ceil((start-minDate)/(1000*60*60*24));
   const duration=Math.ceil((end-start)/(1000*60*60*24))+1;

   const row=document.createElement('div');
   row.className='gantt-row';

   row.innerHTML=`
      <div class='task-name'>${t.name}</div>
      <div class='timeline'>
         <div class='bar'
              style='left:${(offset/totalDays)*100}%;width:${(duration/totalDays)*100}%'>
              ${duration} d
         </div>
      </div>`;

   gantt.appendChild(row);
 });
}
</script>

</body>
</html>
